name: CI

on:
  push:
  pull_request:

jobs:
  local-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate bootstrap package
        run: |
          node --check cli/bin/metron.js
          cd cli
          npm pack --dry-run --json | node -e 'const assert = require("node:assert/strict"); const data = JSON.parse(require("node:fs").readFileSync(0, "utf8")); const files = data[0].files.map(file => file.path).sort(); assert.deepEqual(files, ["LICENSE", "README.md", "bin/metron.js", "package.json"]); console.log(files.join("\n"));'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python and validate manifests
        run: |
          python -m py_compile skills/metron-policy/scripts/*.py
          python3 -B skills/metron-policy/tests/test_circle_transactions.py
          python3 -B skills/metron-policy/tests/test_payment_evidence.py
          python -c 'import json; from pathlib import Path; plugin=json.load(open("plugin.json")); json.load(open(".agents/plugins/marketplace.json")); assert plugin["version"] == "0.2.0"; assert {p.parent.name for p in Path("skills").glob("*/SKILL.md")} == {"metron-policy", "metron-email", "metron-invoice", "metron-payment"}'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Validate invoice renderer and isolated lifecycle
        run: |
          cd skills/metron-invoice
          bun install --frozen-lockfile
          bun run typecheck
          bun test
          python3 -B tests/test_workflow.py -v
      - name: Isolated CLI smoke
        run: |
          state="$(mktemp -d)"
          METRON_HOME="$state" python3 -B skills/metron-policy/scripts/run.py --help
          METRON_HOME="$state" python3 -B skills/metron-policy/scripts/run.py init
          METRON_HOME="$state" python3 -B skills/metron-policy/scripts/run.py status
          METRON_HOME="$state" python3 -B skills/metron-policy/scripts/run.py dashboard --no-open
          grep -q '<title>METRON · Economic Operations</title>' "$state/dashboard.html"
          if grep -Eq 'METRON_(METRICS|SECTIONS|STATUS)' "$state/dashboard.html"; then exit 1; fi
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge fmt --check
        working-directory: contracts
      - run: forge build
        working-directory: contracts
      - run: forge test -vv
        working-directory: contracts
